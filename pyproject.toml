[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "study-research-agent"
version = "0.1.0"
description = "A local AI-assisted study agent that uses tools to read files, search evidence, and calculate safely."
requires-python = ">=3.10"
readme = "README.md"
authors = [{ name = "Student Project" }]

[project.scripts]
study-agent = "ai_study_agent.cli:main"

[project.optional-dependencies]
ai = ["openai>=1.0"]
dev = ["pytest>=8.0,<9.0"]

[tool.setuptools.packages.find]
include = ["ai_study_agent*"]
